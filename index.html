<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Arkanoid</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #eee;
    font-family: monospace, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #game-container {
    position: relative;
    width: 480px;
    margin-top: 16px;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    width: 480px;
    padding: 4px 8px;
    box-sizing: border-box;
    font-size: 16px;
  }

  #game-canvas {
    display: block;
    background: #000;
    border: 2px solid #444;
  }

  #hud-mute {
    background: none;
    border: 1px solid #444;
    color: #eee;
    font-family: monospace, sans-serif;
    font-size: 14px;
    cursor: pointer;
    padding: 2px 8px;
  }
</style>
</head>
<body>

  <div id="game-container">
    <div id="hud">
      <span id="hud-score">Score: 0</span>
      <span id="hud-lives">Vidas: 3</span>
      <span id="hud-best">Best: 0</span>
      <button id="hud-mute">🔊</button>
    </div>
    <canvas id="game-canvas" width="480" height="640"></canvas>
  </div>

  <script src="assets/spritesheet.js"></script>
  <script src="game.js"></script>
</body>
</html>
